<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>軍陶第二入口</title>
<style>html,body{margin:0;height:100%;background:#0e1420}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}</style>
</head>
<body>
<script>
const APP = 'https://script.google.com/macros/s/AKfycbyoJOZI7jJLYpjKuomjd4oAPZQJGr8BrE3ycOPm4fcnDm5rFUWRcJtN3Olr-Ed3xJ9i0Q/exec';
const KEY = 'jt_token_app2';
const params = new URLSearchParams(location.search);
try { const token = localStorage.getItem(KEY); if (token) params.set('t', token); } catch (e) {}
const frame = document.createElement('iframe');
frame.setAttribute('credentialless', '');
frame.title = '軍陶第二入口';
frame.allow = 'camera; clipboard-write';
window.addEventListener('message', function (event) {
  if (event.source !== frame.contentWindow) return;
  try { if (!new URL(event.origin).hostname.endsWith('.googleusercontent.com')) return; } catch (e) { return; }
  if (event.data && typeof event.data === 'object' && 'jtToken' in event.data) {
    const token = event.data.jtToken;
    if (typeof token !== 'string') return;
    try { token ? localStorage.setItem(KEY, token) : localStorage.removeItem(KEY); } catch (e) {}
  }
});
frame.src = APP + (params.toString() ? '?' + params.toString() : '');
document.body.appendChild(frame);
</script>
</body>
</html>
